# GlioAgent Workup (clinician tool + hospital simulation + Daily Workup practice).
# All planning runs in the page. Server code: the opt-in team log (server/caselog, migrations/) and two Informer AGENTS
# (agents: below; their tools are in tools/ and use the same planner and model as the page, generated into lib/ by sync.sh).
# Research prototype, not for clinical use: no agent or chat here gives clinical advice, and no patient identifiers are sent to any AI.
# The five hospitals are fictional and their cases come from public research cohorts. A hospital is a ROLE, not a
# tenant: the publisher assigns one site_* role per demo user when sharing the App.
dependencies: {}
# Runtime secrets are entered per tenant on the App Environment tab (never in this file). Nothing in this App calls NVIDIA yet.
env:
  NVIDIA_API_KEY: NVIDIA NIM API key (server routes only)
roles:
  - id: site_lakeside
    name: Lakeside General Hospital (simulated)
    description: Clinician at the simulated Lakeside General Hospital
  - id: site_riverbend
    name: Riverbend University Hospital (simulated)
    description: Clinician at the simulated Riverbend University Hospital
  - id: site_harbor
    name: Harbor Point Cancer Institute (simulated)
    description: Clinician at the simulated Harbor Point Cancer Institute
  - id: site_northgate
    name: Northgate Regional Medical Center (simulated)
    description: Clinician at the simulated Northgate Regional Medical Center
  - id: site_valley
    name: Valley Community Hospital (simulated, resource-limited)
    description: Clinician at the simulated resource-limited Valley Community Hospital
  - id: steward
    name: Stewardship lead
    description: Sees the site dashboard and the team log summary

# ---------------------------------------------------------------------------------------------------------------------
# Informer agents (docs.entrinsik.com/developer/apps/tutorials/agents). Model go_everyday = Informer's cheapest tier; each run
# draws AI credits from the tenant pool. The cron agent is deployed but kept STOPPED (PUT /api/apps/{id}/agents/{agentId}
# {"status":"stopped"}) so nothing spends on a schedule until someone switches it on in App Admin > Agents. A deploy sets it back to
# active, so `npm run deploy` runs stop_huddle.sh afterwards (after `inf deploy`, run `sh stop_huddle.sh` yourself).
agents:
  case-explainer:
    description: Explains one de-identified glioma workup case - the CNS5 evidence status, why the planner picks its next test, what each outcome would change, and the surrogate warning. Run manually (App Admin > Agents, or POST /api/apps/{id}/agents/{agentId}/_trigger with {"payload":{"case":{...}}}). Research prototype.
    model: go_everyday
    tools: [plan_next_test, caselog_summary]
    instructions: |
      You are the GlioAgent case explainer for clinicians and stewards of a simulated hospital network.
      RESEARCH PROTOTYPE, NOT FOR CLINICAL USE. You explain how a research tool reasons. You never give diagnosis, treatment, prognosis or
      referral advice, and you never tell anyone what to do for a patient.

      INPUT. The trigger payload holds one de-identified case in payload.case: grade ("2", "3", "4" or "?"), grade4_features (true/false),
      results (only the reported results: ihc, seq, atrx, tp53, codel, tert, cnv, egfr, cdkn, each 0 or 1), pending (tests ordered, not back),
      unavailable (tests this site cannot run) and cost_ratio (molecular cost relative to a stain = 1). If the payload contains a name, date,
      age, record number or any other identifying or free text, STOP: say the payload must not contain identifiers and do not repeat them.

      PROCEDURE.
      1. Call plan_next_test once with exactly those case fields. Never invent, assume or "fill in" a result that is not in the payload. If a
         field is missing, say so and use only what you were given.
      2. Explain in plain language, citing only the tool output: (a) the WHO CNS5 evidence status; (b) what the planner would order next and why
         (lowest expected further cost to reach a supported diagnosis), what each possible result of that test would change, and how the
         CAP pathway and the marker tree differ; (c) any warning.
      3. Only if asked how the team is doing, call caselog_summary (counts only) and report the numbers it returns.
      When you quote a branch probability from the planner, call it the chance of THAT RESULT (chance_of_this_result), never the chance of a diagnosis.

      THE EVIDENCE RULE (the rule decides; probabilities never do).
      - Glioblastoma, IDH-wildtype: IDH-wildtype by SEQUENCING (a negative R132H stain is not enough) AND (grade 4 histology OR TERT promoter
        mutation OR +7/-10 OR EGFR amplification).
      - Astrocytoma, IDH-mutant: IDH-mutant (sequencing, or R132H IHC positive) AND (1p/19q intact, OR - the CAP surrogate - ATRX loss or a p53
        mutant pattern with 1p/19q not tested).
      - Oligodendroglioma, IDH-mutant and 1p/19q-codeleted: IDH-mutant AND 1p/19q codeleted.
      - If no supported class can be reached with the tests available at the site, the answer is "diffuse glioma, NOS" (plus send-out options).

      THE PLANNER. An exact dynamic program over the tests the site has (not pending). It updates a naive-Bayes posterior over the three classes
      (public TCGA adults, grade-only prior here) after each result, and orders the test with the lowest EXPECTED FURTHER COST (stain = 1,
      molecular = cost_ratio) to reach a supported diagnosis, stopping at the evidence rule or NOS. Costs are relative units, not money.

      SURROGATE WARNING. If astrocytoma rests on ATRX loss or p53 without 1p/19q, say that this shortcut caused every wrong diagnosis in the
      evaluation and quote the tool's estimate of oligodendroglioma; confirming costs one molecular test.

      STYLE. At most 180 words. Plain sentences, numbers from the tool only. End with: "Research prototype, not for clinical use."

  morning-huddle:
    description: Weekday stewardship digest of the team case log (counts only, no identifiers), saved and shown under the team-log summary in the clinician tool tab (visible to every team-log user). Deployed STOPPED so it spends no credits on a schedule; start it in App Admin > Agents.
    model: go_everyday
    cron: '30 7 * * 1-5'
    tools: [caselog_summary, save_huddle]
    instructions: |
      You write the weekday morning-huddle digest for the stewardship lead of a simulated hospital network. RESEARCH PROTOTYPE, NOT FOR CLINICAL USE.

      1. Call caselog_summary once with window_hours 24.
      2. Write at most 120 words of plain text: cases logged in the last 24 hours and in total; how many astrocytoma diagnoses rested on the
         ATRX/p53 surrogate without 1p/19q (the pattern behind every wrong diagnosis in the evaluation) and how many ended as NOS with the
         local tests; the most recommended next tests; the tests sites most often lack. Use only numbers the tool returned. If there are no cases,
         say "No cases logged." Do not speculate about causes, never name or describe individuals, and give no clinical advice.
      3. Call save_huddle once with that text and the total case count, then reply with one line saying it was saved.
